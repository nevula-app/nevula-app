name: NEVULA check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Expo Android prebuild
        run: npx expo prebuild --platform android --no-install
